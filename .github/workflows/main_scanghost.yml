name: CI/CD ScanGhost - Full Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # --- BACKEND ---
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build & Publish
        run: |
          find . -name "*.sln" -exec dotnet restore {} \;
          find . -name "*.sln" -exec dotnet build {} --configuration Release --no-restore \;
          API_PROJECT=$(find . -name "GhostScan.Api.csproj" | head -n 1)
          dotnet publish "$API_PROJECT" -c Release -o ./publish_api

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'WebApplication-ScanGhost'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish_api

  # --- FRONTEND ---
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_CLIFF_05893530F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          api_location: ""
          output_location: "dist"
        env:
          VITE_API_BASE_URL: https://webapplication-scanghost.azurewebsites.net
